name: qwc/gui-release-builds

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release artifact name prefix"
        required: false
        default: "qwertycoin-gui-dev"
      target:
        description: "Build target"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
  push:
    tags:
      - "v*"

jobs:
  linux-x86_64:
    name: Linux x86_64
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux' }}
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      ARTIFACT_PREFIX: ${{ github.event.inputs.release_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git ccache python3 \
            libboost-all-dev libssl-dev libzmq3-dev libpgm-dev libunbound-dev \
            libsodium-dev libhidapi-dev libusb-1.0-0-dev libunwind-dev \
            liblzma-dev libreadline-dev libexpat1-dev libudev-dev \
            libgcrypt20-dev libgpg-error-dev \
            qtbase5-dev qtdeclarative5-dev qml-module-qtquick-controls \
            qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-dialogs qml-module-qtquick-window2 \
            qml-module-qtgraphicaleffects qml-module-qtmultimedia \
            qttools5-dev-tools libqt5svg5-dev libqt5xmlpatterns5-dev

      - name: Configure
        run: |
          cmake -S . -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DMANUAL_SUBMODULES=1 \
            -DDEV_MODE=OFF \
            -DWITH_UPDATER=OFF \
            -DUSE_DEVICE_TREZOR=OFF \
            -DQML_TESTS=OFF

      - name: Build
        run: cmake --build build/release --target qwertycoin-gui simplewallet wallet_rpc_server --parallel 2

      - name: Package artifacts
        run: tools/release/package_artifacts.sh build/release "${ARTIFACT_PREFIX}-linux-x86_64" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-x86_64
          path: dist/*

  macos-arm64:
    name: macOS Apple Silicon
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'macos' }}
    runs-on: macos-26
    env:
      ARTIFACT_PREFIX: ${{ github.event.inputs.release_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Install dependencies
        run: |
          brew update
          brew install boost hidapi openssl@3 zmq libpgm unbound \
            libunwind-headers protobuf ccache qt@5 libsodium libgcrypt libgpg-error
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Use CMake 3.30
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install cmake==3.30.9
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH=armv8-a \
            -DBUILD_64=ON \
            -DMANUAL_SUBMODULES=1 \
            -DDEV_MODE=OFF \
            -DWITH_UPDATER=OFF \
            -DUSE_DEVICE_TREZOR=OFF \
            -DQML_TESTS=OFF

      - name: Build
        run: |
          cmake --build build/release --target qwertycoin-gui simplewallet wallet_rpc_server --parallel 3
          cmake --build build/release --target deploy --parallel 1

      - name: Package artifacts
        run: tools/release/package_artifacts.sh build/release "${ARTIFACT_PREFIX}-macos-arm64" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-arm64
          path: dist/*

  windows-x86_64:
    name: Windows x86_64
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' }}
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    env:
      ARTIFACT_PREFIX: ${{ github.event.inputs.release_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-libgpg-error
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-declarative
            mingw-w64-x86_64-qt5-quickcontrols
            mingw-w64-x86_64-qt5-quickcontrols2
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH=default \
            -DSTATIC=OFF \
            -DMANUAL_SUBMODULES=1 \
            -DDEV_MODE=OFF \
            -DWITH_UPDATER=OFF \
            -DUSE_DEVICE_TREZOR=OFF \
            -DQML_TESTS=OFF

      - name: Build
        run: |
          cmake --build build/release --target qwertycoin-gui simplewallet wallet_rpc_server --parallel 2
          cmake --build build/release --target deploy --parallel 1

      - name: Package artifacts
        run: tools/release/package_artifacts.sh build/release "${ARTIFACT_PREFIX}-windows-x86_64" dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-x86_64
          path: dist/*
