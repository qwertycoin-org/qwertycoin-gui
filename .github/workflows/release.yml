name: qwc/gui-release-candidate

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Safe artifact prefix (letters, numbers, dot, underscore, hyphen)"
        required: true
        default: "qwertycoin-gui-v2.0.1"
        type: string
      expected_revision:
        description: "Exact 40-character GUI commit SHA to build"
        required: true
        type: string
      target:
        description: "Build one platform per run"
        required: true
        type: choice
        options:
          - linux
          - windows
          - macos

permissions:
  contents: read

concurrency:
  group: qwc-gui-release-candidate-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ARTIFACT_PREFIX: ${{ inputs.release_name }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Validate immutable build request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET" =~ ^(linux|windows|macos)$ ]]

  linux-x86_64:
    name: Linux x86_64
    needs: validate-inputs
    if: ${{ inputs.target == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      ARTIFACT_PREFIX: ${{ inputs.release_name }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      CCACHE_DIR: .ccache
      QWC_LINUX_GLIBC_CEILING: "2.35"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_revision }}
          submodules: false

      - name: Checkout and verify pinned Core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f qwertycoin/.git
          tools/check_core_pin.sh
          tools/check_source_tree_clean.sh
          test "$(git -C qwertycoin rev-parse HEAD)" = "$(git rev-parse HEAD:qwertycoin)"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git ccache python3 file patchelf \
            libboost-all-dev libssl-dev libzmq3-dev libpgm-dev libunbound-dev \
            libsodium-dev libhidapi-dev libusb-1.0-0-dev libunwind-dev \
            liblzma-dev libreadline-dev libexpat1-dev libudev-dev \
            libgcrypt20-dev libgpg-error-dev \
            qtbase5-dev qtdeclarative5-dev qml-module-qtquick-controls \
            qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-dialogs qml-module-qtquick-window2 \
            qml-module-qtgraphicaleffects qml-module-qtmultimedia \
            qml-module-qt-labs-platform \
            qttools5-dev-tools libqt5svg5-dev libqt5xmlpatterns5-dev

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qwc-gui-linux-x86_64-${{ inputs.expected_revision }}
          restore-keys: qwc-gui-linux-x86_64-

      - name: Configure
        run: |
          cmake -S . -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMANUAL_SUBMODULES=1 \
            -DDEV_MODE=OFF \
            -DWITH_UPDATER=OFF \
            -DUSE_DEVICE_TREZOR=OFF \
            -DQML_TESTS=OFF

      - name: Build
        run: cmake --build build/release --target qwertycoin-gui simplewallet wallet_rpc_server --parallel 2

      - name: Verify build preserved source and Core pins
        run: |
          tools/check_core_pin.sh
          tools/check_source_tree_clean.sh

      - name: Package and verify portable artifacts
        run: |
          tools/release/package_artifacts.sh build/release "${ARTIFACT_PREFIX}-linux-x86_64" dist
          cd dist
          sha256sum -c "${ARTIFACT_PREFIX}-linux-x86_64.sha256"

      - name: Smoke-test packaged GUI runtime
        run: tools/release/smoke_linux_gui.sh "dist/${ARTIFACT_PREFIX}-linux-x86_64"

      - name: Upload review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-linux-x86_64
          path: |
            dist/${{ env.ARTIFACT_PREFIX }}-linux-x86_64.tar.gz
            dist/${{ env.ARTIFACT_PREFIX }}-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: macOS Apple Silicon
    needs: validate-inputs
    if: ${{ inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      ARTIFACT_PREFIX: ${{ inputs.release_name }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      CCACHE_DIR: .ccache
      HOMEBREW_NO_AUTO_UPDATE: 1
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      QWC_MACOS_MIN_VERSION: "15.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_revision }}
          submodules: false

      - name: Checkout and verify pinned Core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f qwertycoin/.git
          tools/check_core_pin.sh
          tools/check_source_tree_clean.sh
          test "$(git -C qwertycoin rev-parse HEAD)" = "$(git rev-parse HEAD:qwertycoin)"

      - name: Install dependencies
        run: |
          brew install boost hidapi openssl@3 zmq libpgm unbound \
            libunwind-headers protobuf ccache qt@5 libsodium libgcrypt libgpg-error
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Use CMake 3.30
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install cmake==3.30.9
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qwc-gui-macos-arm64-${{ inputs.expected_revision }}
          restore-keys: qwc-gui-macos-arm64-

      - name: Configure
        run: |
          cmake -S . -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DARCH=armv8-a \
            -DBUILD_64=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${QWC_MACOS_MIN_VERSION}" \
            -DMANUAL_SUBMODULES=1 \
            -DDEV_MODE=OFF \
            -DWITH_UPDATER=OFF \
            -DUSE_DEVICE_TREZOR=OFF \
            -DQML_TESTS=OFF

      - name: Build and deploy bundle
        run: |
          cmake --build build/release --target qwertycoin-gui simplewallet wallet_rpc_server --parallel 2
          cmake --build build/release --target deploy --parallel 1

      - name: Verify build preserved source and Core pins
        run: |
          tools/check_core_pin.sh
          tools/check_source_tree_clean.sh

      - name: Package and verify portable artifacts
        run: |
          tools/release/package_artifacts.sh build/release "${ARTIFACT_PREFIX}-macos-arm64" dist
          cd dist
          shasum -a 256 -c "${ARTIFACT_PREFIX}-macos-arm64.sha256"

      - name: Install pinned DMG packager
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install \
            --require-hashes -r tools/release/dmgbuild-requirements.txt
          echo "DMGBUILD_BIN=$RUNNER_TEMP/dmgbuild-venv/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Create and verify read-only drag-and-drop DMG
        shell: bash
        run: |
          set -euo pipefail
          artifact="${ARTIFACT_PREFIX}-macos-arm64"
          tools/release/create_macos_dmg.sh "dist/$artifact" "$artifact" dist
          tools/release/verify_macos_dmg.sh "dist/$artifact.dmg" "dist/$artifact"

          mkdir macos-candidate
          cp \
            "dist/$artifact.tar.gz" \
            "dist/$artifact.sha256" \
            "dist/$artifact.dmg" \
            "dist/$artifact.dmg.sha256" \
            macos-candidate/
          tools/release/validate_candidate_files.py \
            --directory macos-candidate \
            --expected "$artifact.tar.gz" \
            --expected "$artifact.sha256" \
            --expected "$artifact.dmg" \
            --expected "$artifact.dmg.sha256" \
            --checksum-file "$artifact.dmg.sha256" \
            --checksum-target "$artifact.dmg"

      - name: Capture Finder layout for native review
        shell: bash
        run: |
          set -euo pipefail
          artifact="${ARTIFACT_PREFIX}-macos-arm64"
          mkdir finder-review
          tools/release/capture_macos_dmg_layout.sh \
            "dist/$artifact.dmg" "finder-review/$artifact-finder.png"

      - name: Upload review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-arm64
          path: |
            macos-candidate/${{ env.ARTIFACT_PREFIX }}-macos-arm64.tar.gz
            macos-candidate/${{ env.ARTIFACT_PREFIX }}-macos-arm64.sha256
            macos-candidate/${{ env.ARTIFACT_PREFIX }}-macos-arm64.dmg
            macos-candidate/${{ env.ARTIFACT_PREFIX }}-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload Finder review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-macos-arm64-finder-layout
          path: finder-review/${{ env.ARTIFACT_PREFIX }}-macos-arm64-finder.png
          if-no-files-found: error
          retention-days: 7

  windows-x86_64:
    name: Windows x86_64
    needs: validate-inputs
    if: ${{ inputs.target == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    env:
      ARTIFACT_PREFIX: ${{ inputs.release_name }}
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      CCACHE_DIR: .ccache
      # Apply before actions/checkout so Git-for-Windows and MSYS2 Git both
      # materialize and verify the exact LF-normalized repository contents.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_revision }}
          submodules: false

      - name: Configure MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            zip
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-libgpg-error
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-ldns
            mingw-w64-x86_64-md4c
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-declarative
            mingw-w64-x86_64-qt5-quickcontrols
            mingw-w64-x86_64-qt5-quickcontrols2
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-angleproject

      # Use the same MSYS2 Git for the recursive checkout and the post-build
      # cleanliness check. Mixing Git-for-Windows and MSYS2 Git makes the Core
      # tree appear modified solely because their autocrlf defaults differ.
      - name: Checkout and verify pinned Core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f qwertycoin/.git
          tools/check_core_pin.sh
          tools/check_source_tree_clean.sh
          test "$(git -C qwertycoin rev-parse HEAD)" = "$(git rev-parse HEAD:qwertycoin)"

          version_major=$(sed -nE 's/^set\(VERSION_MAJOR "([0-9]+)"\)$/\1/p' CMakeLists.txt)
          version_minor=$(sed -nE 's/^set\(VERSION_MINOR "([0-9]+)"\)$/\1/p' CMakeLists.txt)
          version_revision=$(sed -nE 's/^set\(VERSION_REVISION "([0-9]+)"\)$/\1/p' CMakeLists.txt)
          test -n "$version_major" && test -n "$version_minor" && test -n "$version_revision"
          echo "QWC_GUI_VERSION=${version_major}.${version_minor}.${version_revision}" >> "$GITHUB_ENV"

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '7.1.0'
          $asset = "innosetup-$version-x64.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $asset
          $expectedHash = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/$asset" `
            -OutFile $assetPath
          $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup digest mismatch: $actualHash"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $assetPath
          if ($signature.Status -ne 'Valid') {
            throw "Inno Setup Authenticode verification failed: $($signature.Status)"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "inno-$version"
          $process = Start-Process -FilePath $assetPath -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=`"$installRoot`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed: $($process.ExitCode)"
          }
          $iscc = Join-Path $installRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw 'Pinned Inno Setup compiler was not installed'
          }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile installer contract before the native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'qwertycoin-installer-contract'
          $artifact = "qwertycoin-gui-v$env:QWC_GUI_VERSION-windows-x86_64"
          $package = Join-Path $fixtureRoot $artifact
          $output = Join-Path $fixtureRoot 'output'
          New-Item -ItemType Directory -Path (Join-Path $package 'platforms') -Force | Out-Null
          foreach ($file in @(
            'qwertycoin-gui.exe',
            'qwertycoind.exe',
            'qwertycoin-wallet-cli.exe',
            'qwertycoin-wallet-rpc.exe',
            'platforms\qwindows.dll'
          )) {
            [System.IO.File]::WriteAllText((Join-Path $package $file), "contract fixture $file")
          }
          Copy-Item -LiteralPath LICENSE, README.md -Destination $package
          $coreRevision = (git rev-parse HEAD:qwertycoin).Trim()
          [System.IO.File]::WriteAllLines(
            (Join-Path $package 'BUILD-INFO.txt'),
            @(
              "source_revision=$env:EXPECTED_REVISION",
              "core_revision=$coreRevision",
              "app_version=$env:QWC_GUI_VERSION",
              'runner_os=Windows',
              'runner_arch=X64',
              'qt_version=contract-fixture'
            ),
            [System.Text.UTF8Encoding]::new($false)
          )
          tools/release/windows/create_windows_installer.ps1 `
            -PackageDir $package `
            -ArtifactName $artifact `
            -Version $env:QWC_GUI_VERSION `
            -OutputDir $output `
            -IsccPath $env:INNO_ISCC
          if (-not (Test-Path -LiteralPath (Join-Path $output "$artifact-setup.exe") -PathType Leaf)) {
            throw 'Installer contract did not produce an executable'
          }
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: qwc-gui-windows-x86_64-${{ inputs.expected_revision }}
          restore-keys: qwc-gui-windows-x86_64-

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DARCH=default \
            -DSTATIC=OFF \
            -DMANUAL_SUBMODULES=1 \
            -DDEV_MODE=OFF \
            -DWITH_UPDATER=OFF \
            -DUSE_DEVICE_TREZOR=OFF \
            -DQML_TESTS=OFF

      - name: Build and deploy runtime
        run: |
          cmake --build build/release --target qwertycoin-gui simplewallet wallet_rpc_server --parallel 2
          cmake --build build/release --target deploy --parallel 1

      - name: Verify build preserved source and Core pins
        run: |
          tools/check_core_pin.sh
          tools/check_source_tree_clean.sh

      - name: Package and verify portable artifacts
        run: |
          tools/release/package_artifacts.sh build/release "${ARTIFACT_PREFIX}-windows-x86_64" dist
          cd dist
          sha256sum -c "${ARTIFACT_PREFIX}-windows-x86_64.sha256"

      - name: Create and natively verify secure Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = "$env:ARTIFACT_PREFIX-windows-x86_64"
          tools/release/windows/create_windows_installer.ps1 `
            -PackageDir "dist/$artifact" `
            -ArtifactName $artifact `
            -Version $env:QWC_GUI_VERSION `
            -OutputDir dist `
            -IsccPath $env:INNO_ISCC
          New-Item -ItemType Directory -Path windows-installer-review | Out-Null
          tools/release/windows/test_windows_installer.ps1 `
            -PackageDir "dist/$artifact" `
            -ArtifactName $artifact `
            -Version $env:QWC_GUI_VERSION `
            -SetupPath "dist/$artifact-setup.exe" `
            -IsccPath $env:INNO_ISCC `
            -ReportPath "windows-installer-review/$artifact-installer-test-report.md"

      - name: Validate exact Windows candidate set
        run: |
          set -euo pipefail
          artifact="${ARTIFACT_PREFIX}-windows-x86_64"
          mkdir windows-candidate
          cp \
            "dist/$artifact.zip" \
            "dist/$artifact.sha256" \
            "dist/$artifact-setup.exe" \
            "dist/$artifact-setup.exe.sha256" \
            windows-candidate/
          tools/release/validate_candidate_files.py \
            --directory windows-candidate \
            --expected "$artifact.zip" \
            --expected "$artifact.sha256" \
            --expected "$artifact-setup.exe" \
            --expected "$artifact-setup.exe.sha256" \
            --checksum-file "$artifact-setup.exe.sha256" \
            --checksum-target "$artifact-setup.exe"

      - name: Upload review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-x86_64
          path: |
            windows-candidate/${{ env.ARTIFACT_PREFIX }}-windows-x86_64.zip
            windows-candidate/${{ env.ARTIFACT_PREFIX }}-windows-x86_64.sha256
            windows-candidate/${{ env.ARTIFACT_PREFIX }}-windows-x86_64-setup.exe
            windows-candidate/${{ env.ARTIFACT_PREFIX }}-windows-x86_64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload native installer test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-windows-x86_64-installer-test-report
          path: windows-installer-review/${{ env.ARTIFACT_PREFIX }}-windows-x86_64-installer-test-report.md
          if-no-files-found: error
          retention-days: 7
